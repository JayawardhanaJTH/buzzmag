<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow-ts" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-ts)"/>
  <rect x="25" y="25" width="550" height="350" rx="16" fill="#ffffff" stroke="#ed0e28" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow-ts)"/>
  
  <!-- Newspaper / Breaking News icon -->
  <g transform="translate(300, 145)" text-anchor="middle">
    <rect x="-42" y="-36" width="84" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <path d="M-28,-18 L-28,-2 M-18,-18 L18,-18 M-18,-10 L18,-10 M-18,-2 L18,-2 M-28,10 L28,10 M-28,18 L18,18" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="-24" r="16" fill="#ed0e28"/>
    <path d="M28,-30 L28,-22 M28,-18 L28,-17" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#991b1b" text-anchor="middle">
    දවසේ ප්‍රධාන පුවත් (Top Stories of the Day)
  </text>
  <text x="300" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">
    Appearance &gt; Customize &gt; 3D News Portal Settings
  </text>
  <text x="300" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78716c" text-anchor="middle">
    Upload your daily top stories image here
  </text>
</svg>
