<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="25" y="25" width="550" height="350" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
  
  <!-- Easel & Canvas icon -->
  <g transform="translate(300, 150)" text-anchor="middle">
    <!-- Palette icon -->
    <circle cx="0" cy="-20" r="48" fill="#ffedd5"/>
    <path d="M-22,-26 C-22,-40 22,-40 22,-26 C22,-14 12,-6 0,-6 C-12,-6 -22,-14 -22,-26 Z" fill="#ea580c"/>
    <circle cx="-10" cy="-26" r="4" fill="#ffffff"/>
    <circle cx="0" cy="-32" r="4" fill="#ffffff"/>
    <circle cx="10" cy="-26" r="4" fill="#ffffff"/>
    <path d="M-4,-2 C-10,14 -18,36 -24,46 M4,-2 C10,14 18,36 24,46" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#9a3412" text-anchor="middle">
    දවසේ කාටූනය (Cartoon of the Day)
  </text>
  <text x="300" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ea580c" text-anchor="middle">
    Appearance &gt; Customize &gt; 3D News Portal Settings
  </text>
  <text x="300" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78716c" text-anchor="middle">
    Upload your daily cartoon image here
  </text>
</svg>

